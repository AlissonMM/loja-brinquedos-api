spring.application.name=kidsgrace

spring.datasource.url=jdbc:mysql://localhost:3306/kidsgrace
spring.datasource.username=root
spring.datasource.password=root


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.kafka.bootstrap-servers=localhost:9092

# Origens liberadas para CORS (separadas por vírgula). Sobrescreva em produção via
# variável de ambiente APP_CORS_ALLOWED_ORIGINS com o(s) domínio(s) real(is) do frontend,
# ex.: APP_CORS_ALLOWED_ORIGINS=https://kidsgrace.com
app.cors.allowed-origins=http://localhost:*

# Usuário admin criado automaticamente no startup (AdminUserSeeder) caso ainda
# não exista. TROQUE esses valores (ou sobrescreva via variáveis de ambiente
# APP_SEED_ADMIN_USERNAME / APP_SEED_ADMIN_PASSWORD / ...) antes de produção.
app.seed.admin.username=admin
app.seed.admin.password=conecta@2024
app.seed.admin.email=admin@admin.com
app.seed.admin.name=Administrador