spring.application.name=morkstore

# Formato ${VARIAVEL:default}: o default serve para rodar localmente sem
# configurar nada; em Docker/produção os valores vêm de variáveis de ambiente.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/morkstore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Origens liberadas para CORS (separadas por vírgula).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Segredo HMAC do JWT (mínimo 32 caracteres). Precisa ser o MESMO no
# morkstore-analytics-service, que valida os tokens emitidos aqui.
# O default abaixo é só para desenvolvimento local.
app.jwt.secret=${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:70000000}

# Usuário admin criado automaticamente no startup (AdminUserSeeder) caso ainda
# não exista.
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.password=${ADMIN_PASSWORD:conecta@2024}
app.seed.admin.email=${ADMIN_EMAIL:admin@admin.com}
app.seed.admin.name=${ADMIN_NAME:Administrador}
